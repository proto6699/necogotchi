; neco-cyd: PlatformIO project for the ESP32-2432S028R ("Cheap Yellow Display")
; Build + flash:  pio run -t upload        Serial monitor: pio device monitor
[env:cyd]
platform = espressif32@6.9.0          ; Arduino core 2.0.17
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv ; 3 MB app + ~900 KB LittleFS for reflections
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  earlephilhower/ESP8266Audio@1.9.7
  bblanchon/ArduinoJson@7.2.1
build_flags =
  -Os
  -DUSER_SETUP_LOADED=1
  -DILI9341_2_DRIVER=1         ; most CYDs. Single-USB-C "CYD2USB" boards: swap to -DST7789_DRIVER=1 and add -DTFT_INVERSION_ON
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DUSE_HSPI_PORT=1
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1
  -DSPI_FREQUENCY=55000000
  -DSPI_READ_FREQUENCY=6000000   ; slower readback is more reliable for the CRT effects
